name: chatify
description: "A WhatsApp-style chat application built with Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Backend – Supabase
  supabase_flutter: ^2.8.4

  # Environment variables
  flutter_dotenv: ^5.2.1

  # Local persistence
  shared_preferences: ^2.3.5

  # Media
  image_picker: ^1.1.2

  # Device info
  device_info_plus: ^11.4.0

  # Functional programming / error handling
  dartz: ^0.10.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - .env
